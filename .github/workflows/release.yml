# Push a tag like v1.2 to build the DMG and publish it as a GitHub Release.
# Pull requests build the DMG too, without publishing.
# Signing and notarization turn on when these repository secrets exist:
#   MACOS_CERT_P12        base64 of the "Developer ID Application" .p12
#   MACOS_CERT_PASSWORD   its password
#   NOTARY_KEY_P8         base64 of the App Store Connect API key (.p8)
#   NOTARY_KEY_ID, NOTARY_ISSUER
name: Release

on:
  push:
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  release:
    runs-on: xcode-27  # code uses the macOS 27 SDK; macos-15/26 images ship older Xcode
    env:
      MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
      MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
      NOTARY_KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
      NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
      NOTARY_ISSUER: ${{ secrets.NOTARY_ISSUER }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0  # build number is the commit count

      - name: Import signing certificate
        if: env.MACOS_CERT_P12 != ''
        run: |
          KC="$RUNNER_TEMP/signing.keychain-db"
          KC_PW=$(openssl rand -base64 24)
          echo "$MACOS_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KC_PW" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KC_PW" "$KC"
          security import "$RUNNER_TEMP/cert.p12" -P "$MACOS_CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KC"
          security set-key-partition-list -S apple-tool:,apple: -k "$KC_PW" "$KC"
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          echo "SIGN_IDENTITY=Developer ID Application" >> "$GITHUB_ENV"

      - name: Prepare notarization key
        if: env.MACOS_CERT_P12 != '' && env.NOTARY_KEY_P8 != ''
        run: |
          echo "$NOTARY_KEY_P8" | base64 --decode > "$RUNNER_TEMP/notary.p8"
          echo "NOTARY_KEY=$RUNNER_TEMP/notary.p8" >> "$GITHUB_ENV"

      - name: Diagnose disk image tools  # TEMP
        continue-on-error: true
        run: |
          try() { echo "=== $1"; hdiutil create -verbose -volname T -srcfolder "$2" -format UDZO -ov "$RUNNER_TEMP/t.dmg" 2>&1 | grep -vE 'useRealIDs|useEffectiveIDs|processKernelRequest' | tail -25; }
          A="$RUNNER_TEMP/a"; mkdir -p "$A"; echo hi > "$A/x.txt"; ln -s /Applications "$A/Applications"
          try "runner_temp + /Applications symlink" "$A"
          B=$(mktemp -d); echo hi > "$B/x.txt"
          echo "mktemp dir: $B"; try "mktemp dir, no symlink" "$B"
          C="$RUNNER_TEMP/c"; mkdir -p "$C"; echo hi > "$C/x.txt"; ln -s /tmp "$C/link"
          try "runner_temp + symlink to /tmp" "$C"
          echo "=== relative output path"; (cd "$RUNNER_TEMP" && hdiutil create -volname T -srcfolder "$A" -format UDZO -ov rel.dmg 2>&1 | tail -3)

      - name: Build DMG
        run: |
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then VERSION="${GITHUB_REF_NAME#v}"; else VERSION=0.0; fi
          VERSION="$VERSION" ./dmg.sh

      - name: Publish release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "MD-Widgets-${GITHUB_REF_NAME#v}.dmg" --title "MD Widgets ${GITHUB_REF_NAME#v}" --generate-notes
